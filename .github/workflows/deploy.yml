name: Build & Deploy

on:
  push:
    branches:
      - feat/development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/html/pallbearer
            git pull origin feat/development
            mvn clean install -DskipTests=true
            sudo systemctl restart quarkus-backend.service
            sudo systemctl status quarkus-backend.service
