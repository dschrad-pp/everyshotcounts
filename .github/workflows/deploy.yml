name: Build & Deploy

on:
  push:
    branches:
      - feat/development

# NOTE: The clean-room build/test gate was temporarily removed because the
# `media` source package (media/ffmpeg, media/thronescv, media/pipeline, etc.)
# is not yet committed to git — it only exists on the EC2 box, so a fresh CI
# checkout cannot compile. Until that source is added to the repo, the build is
# only reproducible on EC2. The on-box script below fails safe: a broken build
# aborts before restart, and a broken boot is caught by a /health/ready poll
# that fails the deploy red.
# TODO: re-add a clean-room `build-and-test` job with `needs:` once the media/
# source is committed to git (it's currently EC2-only — also a data-loss risk).

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Build (~1 min) + dev-mode cold-start poll (up to ~5 min) must fit
          # inside the SSH command budget (default is 10m).
          command_timeout: "15m"
          # set -euo pipefail: any failing command (e.g. a broken build) aborts
          # the script before the service is restarted, so a failed build never
          # results in a restart onto broken/stale code.
          #
          # Gate (fail-loud): build -> restart -> poll the app's real readiness
          # endpoint. A compile error aborts before restart (build gate); a
          # runtime/boot failure is caught by the /health/ready poll, which fails
          # the deploy red and dumps logs. We do NOT auto-rollback — the service is
          # left as-is for a fix-forward.
          script: |
            set -euo pipefail
            cd /var/www/html/pallbearer
            git pull origin feat/development

            # Build first. With set -e, a compile failure stops here, before any
            # restart, so the running service is never replaced by a broken build.
            mvn clean install -DskipTests=true

            sudo systemctl restart quarkus-backend.service

            # Readiness gate: poll the real health endpoint, not just
            # `systemctl is-active`. is-active only proves the JVM process
            # launched; /health/ready (quarkus-smallrye-health) proves the app
            # actually booted, wired its datasource/Flyway migrations, and is
            # serving requests. Port 8000 matches pallbearer.server.base-url.
            #
            # The service runs in Quarkus DEV mode (quarkus:dev), which augments
            # at runtime — a cold start after restart can take a few minutes
            # before port 8000 listens. So allow up to ~5 min (60 x 5s) and cap
            # each probe with --max-time so a hanging first request can't eat the
            # whole budget.
            echo "Waiting for /health/ready (dev-mode cold start can take minutes)..."
            for i in $(seq 1 60); do
              if curl -fsS --max-time 5 http://localhost:8000/health/ready >/dev/null 2>&1; then
                echo "✅ Service healthy after ~$((i * 5))s."
                sudo systemctl status quarkus-backend.service --no-pager
                exit 0
              fi
              sleep 5
            done

            echo "❌ Service did not become healthy within ~5 min — failing deploy."
            sudo journalctl -u quarkus-backend.service -n 80 --no-pager || true
            sudo systemctl status quarkus-backend.service --no-pager || true
            exit 1
