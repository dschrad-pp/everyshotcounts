[Service]
Environment="SERVER_NAME=thrones"
Environment="THRONES_HOME=/work/lektralabs.com/thrones"
Environment="PGHOST=rs-database.crw3bxnxyerb.us-east-1.rds.amazonaws.com"
Environment="PGPASSWORD=EbGRMiTuBi3HWX4k"
Environment="QUARKUS_HTTP_PORT=80"
Environment="QUARKUS_HTTP_SSL_PORT=443"
Environment="QUARKUS_HTTP_SSL_CERTIFICATE_FILE=/etc/letsencrypt/live/quarkus.lektralabs.com/fullchain.pem"
Environment="QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILE=/etc/letsencrypt/live/quarkus.lektralabs.com/privkey.pem"
Environment="KEYCLOAK_URL=http://localhost:8080"
# HTTP response compression — off by default in Quarkus, so every JSON response
# was going out uncompressed. The coach roster/leaderboard payloads are the large
# ones and they compress well, which matters most on mobile networks.
# NOTE: this file is a systemd drop-in template; editing it here does NOT change
# the running service. Apply on the box with a daemon-reload + restart, or set the
# same two keys in the (gitignored) application.properties that lives there.
Environment="QUARKUS_HTTP_ENABLE_COMPRESSION=true"
Environment="QUARKUS_HTTP_COMPRESS_MEDIA_TYPES=application/json,text/plain,text/html,text/css,text/javascript,application/javascript"
Environment="PALLBEARER_MEDIA_STORE=/media/thrones/pallbearer/media"
Environment="FFMPEG_BIN=/usr/local/bin/ffmpeg"
Environment="BENTO_PATH=/usr/local/bento4"
