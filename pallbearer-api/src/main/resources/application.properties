# Port
quarkus.http.port=8000

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PGUSER:postgres}
quarkus.datasource.password=${PGPASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}/thrones_db
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.transaction-isolation-level=serializable
quarkus.datasource.jdbc.connection-timeout=PT30S
quarkus.datasource.jdbc.idle-removal-interval=PT10M
quarkus.datasource.jdbc.max-lifetime=PT1H

# Allow unauthenticated access to the API
quarkus.http.auth.permission.registration.paths=/api/user/registration/*
quarkus.http.auth.permission.registration.policy=permit

# Allow unauthenticated access to CRM webhook endpoint
quarkus.http.auth.permission.crm-webhook.paths=/api/crm_integration/webhook/*
quarkus.http.auth.permission.crm-webhook.policy=permit



quarkus.http.access-log.enabled=true

# OpenID
keycloak.url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=thrones_realm
quarkus.oidc.auth-server-url=${keycloak.url}/realms/thrones_realm
quarkus.oidc.client-id=thrones_client
# quarkus.oidc.credentials.secret=${KEYCLOAK_SECRET}
quarkus.oidc.credentials.secret=6ga93GIODlxZG6vR4cKup7DPEwmNLq1s
quarkus.oidc.tls.verification=none

# CORS Configuration
quarkus.http.cors=true
# Allow all origins, methods, and headers for development
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-allow-credentials=true

# GZip Compression
quarkus.http.enable-compression=true

# Enable Policy Enforcement (kills dev ui)
# quarkus.keycloak.policy-enforcer.enable=true

# Disables policy enforcement for a path
# quarkus.keycloak.policy-enforcer.paths.1.path=/api/public
# quarkus.keycloak.policy-enforcer.paths.1.enforcement-mode=DISABLED

# Logging
quarkus.log.level=INFO
quarkus.min-log.level=TRACE
# quarkus.log.category."com.lektralabs.thrones.pallbearer.mybatis.mapper.CurrentUserMapper".level=FINEST
quarkus.log.category."me.desair.tus".min-level=TRACE
quarkus.log.category."me.desair.tus".level=TRACE

# Flyway
quarkus.flyway.migrate-at-start=false

# Banner
quarkus.banner.path=banner.txt

# Swagger
quarkus.smallrye-openapi.path=/swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui.html

# Uploads
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.limits.max-form-attribute-size=500M
quarkus.http.limits.max-body-size=500M

# REST timeout
quarkus.http.read-timeout=3600S
quarkus.http.idle-timeout=3600S
quarkus.http.write-timeout=3600S
quarkus.http.request-timeout=3600S

# Pallbearer Media and Content Pipeline Configuration
pallbearer.media.streaming.enabled=false
pallbearer.media.ffmpeg.path=${FFMPEG_BIN:/usr/local/bin/ffmpeg}
pallbearer.media.bento4.mp42hls.path=${BENTO_PATH:/usr/local/bento4}/bin/mp4hls
pallbearer.media.cutscene.gif.enabled=false
pallbearer.media.store=/home/ankit/Downloads/thrones-development/media
pallbearer.media.thrones-cv.url=http://44.240.159.218:5000/upload
pallbearer.media.thrones-cv.username=PALLBEARER
pallbearer.storage.s3.enabled=${PALLBEARER_STORAGE_S3_ENABLED:false}
pallbearer.storage.s3.bucket=${PALLBEARER_STORAGE_S3_BUCKET:}
pallbearer.storage.s3.region=${AWS_REGION:us-east-1}
pallbearer.storage.s3.endpoint=${PALLBEARER_STORAGE_S3_ENDPOINT:}
pallbearer.storage.s3.public-base-url=${PALLBEARER_STORAGE_S3_PUBLIC_BASE_URL:}
pallbearer.storage.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
pallbearer.storage.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Production SSL
%prod.quarkus.http.ssl-port=443
%prod.quarkus.http.insecure-requests=redirect
%prod.quarkus.http.ssl.certificate.files=/etc/letsencrypt/live/quarkus.lektralabs.com/cert.pem
%prod.quarkus.http.ssl.certificate.key-files=/etc/letsencrypt/live/quarkus.lektralabs.com/privkey.pem

# Email Client
quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
quarkus.mailer.from=lektralabs@gmail.com
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=lektralabs@gmail.com
# application name: pallbearer-mail-client
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.mock=false

# CRM Sync Scheduler Configuration
# Enable/disable automatic CRM sync (default: true)
crm.sync.enabled=false
# Cron expression for CRM sync schedule (default: every 20 seconds)
# Format: "second minute hour day-of-month month day-of-week"
# Examples:
#   "*/20 * * * * ?" - Every 20 seconds
#   "0 0 * * * ?" - Every hour
#   "0 0 */6 * * ?" - Every 6 hours
#   "0 0 0 * * ?" - Daily at midnight
#   "0 0 0,12 * * ?" - Twice daily at midnight and noon
crm.sync.cron=*/20 * * * * ?

# CRM Webhook Security Configuration
# Enable/disable webhook security (default: true)
# Set to false only for development/testing
crm.webhook.security.enabled=true
# API key for webhook authentication
# IMPORTANT: Change this to a strong, random value in production
# Can be set via environment variable: CRM_WEBHOOK_API_KEY
crm.webhook.api.key=${CRM_WEBHOOK_API_KEY:change-me-to-secure-api-key}
# Secret key for HMAC signature verification (optional)
# If provided, webhook requests can include X-CRM-Webhook-Signature header for additional security
# Can be set via environment variable: CRM_WEBHOOK_SECRET
crm.webhook.secret=${CRM_WEBHOOK_SECRET:}
